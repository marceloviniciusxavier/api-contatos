services:
  postgres:
    image: postgres:17
    container_name: nuvvo-postgres
    environment:
      POSTGRES_DB: nuvvo
      POSTGRES_USER: nuvvo
      POSTGRES_PASSWORD: nuvvo_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvvo -d nuvvo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data: