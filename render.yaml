databases:
  - name: nuvvo-db
    plan: free
    databaseName: nuvvo
    user: nuvvo

services:
  - type: web
    name: api-contatos
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/nuvvo-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: homol
      - key: DB_HOST
        fromDatabase:
          name: nuvvo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nuvvo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nuvvo-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: nuvvo-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: nuvvo-db
          property: password
